# Step 1 config — HTTP only. Serves the ACME challenge for certbot and
# redirects everything else to HTTPS once console-ssl.conf.example is
# activated (see DEPLOY.md). Kept as its own file so nginx can start
# successfully before a certificate exists.

server {
    listen 80;
    server_name console.qumaxa.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
